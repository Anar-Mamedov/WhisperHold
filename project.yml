name: DikteOriginal

options:
  bundleIdPrefix: com.anar
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  DikteOriginal:
    type: application
    platform: macOS

    sources:
      - path: Sources
      - path: Python
        buildPhase: resources
        type: folder

    entitlements:
      path: Sources/Resources/Dikte.entitlements
      properties:
        com.apple.security.device.audio-input: true

    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleName: Dikte Original
        CFBundleDisplayName: Dikte Original
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        NSMicrophoneUsageDescription: >-
          Dikte Original, konuşmanızı metne çevirmek için mikrofonu kullanır.
          Ses kaydı yalnızca bu cihazda işlenir ve hiçbir sunucuya gönderilmez.

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anar.dikte-original
        PRODUCT_NAME: DikteOriginal
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: LBPVTCYT79
        PROVISIONING_PROFILE_SPECIFIER: ""
        SWIFT_VERSION: "5.0"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO

