name: WhisperHold

options:
  bundleIdPrefix: com.anar
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  WhisperHold:
    type: application
    platform: macOS

    sources:
      - path: Sources
      - path: Python
        buildPhase: resources
        type: folder

    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig

    entitlements:
      path: Sources/Resources/WhisperHold.entitlements
      properties:
        com.apple.security.device.audio-input: true

    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleName: WhisperHold
        CFBundleDisplayName: WhisperHold
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        NSMicrophoneUsageDescription: >-
          WhisperHold, konuşmanızı metne çevirmek için mikrofonu kullanır.
          Ses kaydı yalnızca bu cihazda işlenir ve hiçbir sunucuya gönderilmez.

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anar.whisperhold
        PRODUCT_NAME: WhisperHold
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        PROVISIONING_PROFILE_SPECIFIER: ""
        SWIFT_VERSION: "5.0"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO

    scheme:
      testTargets:
        - WhisperHoldTests

  # Logic tests for the text pipeline. The bundle compiles the pure Swift
  # sources it needs directly instead of hosting the app, so running the tests
  # never launches the menu bar app or asks for permissions:
  #
  #   xcodebuild test -project WhisperHold.xcodeproj -scheme WhisperHold \
  #     -destination 'platform=macOS'
  WhisperHoldTests:
    type: bundle.unit-test
    platform: macOS

    sources:
      - path: Tests
      - path: Sources/Transcription/TermCorrector.swift
      - path: Sources/Transcription/TextPostProcessor.swift
      - path: Sources/Transcription/SpellingGuard.swift
      - path: Sources/Transcription/BuiltInVocabulary.swift
      - path: Sources/Learning/CorrectionLearner.swift

    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anar.whisperhold.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO

